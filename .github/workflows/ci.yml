name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          } else {
            Write-Host "PSScriptAnalyzer: No issues found." -ForegroundColor Green
          }

      - name: Validate command reference coverage
        shell: pwsh
        run: |
          ./scripts/Test-CommandReferenceCoverage.ps1

      - name: Validate version/changelog policy (push)
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          ./scripts/Test-VersionChangelogPolicy.ps1 -BaseRef '${{ github.event.before }}' -HeadRef '${{ github.sha }}'

      - name: Validate version/changelog policy (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          ./scripts/Test-VersionChangelogPolicy.ps1 -BaseRef '${{ github.event.pull_request.base.sha }}' -HeadRef '${{ github.event.pull_request.head.sha }}'
